
name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'slovo-github-apk-project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unpack project
        run: |
          unzip -o slovo-github-apk-project.zip -d project
          find project -name gradlew -exec chmod +x {} \;

      - name: Build APK
        run: |
          cd "$(dirname "$(find project -name gradlew | head -n 1)")"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: slovo-apk
          path: project/**/build/outputs/apk/**/*.apk
